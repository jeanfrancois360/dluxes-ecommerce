services:
  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nextpik-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/html:/var/www/html
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nextpik-network

  # ─────────────────────────────────────────
  # NestJS API (3 GB RAM limit)
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nextpik-api
    env_file: .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=2816
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/api/v1/settings/public']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nextpik-network

  # ─────────────────────────────────────────
  # PostgreSQL 16 (3 GB RAM limit)
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nextpik-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - nextpik-network

  # ─────────────────────────────────────────
  # Redis 7 (1 GB RAM limit)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nextpik-redis
    command: redis-server --maxmemory 768mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nextpik-network

  # ─────────────────────────────────────────
  # Meilisearch (1 GB RAM limit)
  # ─────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: nextpik-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 512mb
    volumes:
      - meilisearch_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - nextpik-network

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  nextpik-network:
    driver: bridge
